name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the plugin
        run: python3 .github/scripts/check.py ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
