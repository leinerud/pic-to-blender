# A release for every version tag (v0.2.0, …): the notes from the pull requests merged since the last one, and the
# skill as a zip for the Claude app (Settings → Capabilities → Skills → upload). Tag only a commit on main whose
# plugin.json has the same version: git tag v0.2.0 && git push origin v0.2.0
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the plugin's version
        run: |
          v=$(python3 -c "import json; print(json.load(open('plugins/pic-to-blender/.claude-plugin/plugin.json'))['version'])")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME, but plugin.json says $v"; exit 1; fi
      - name: Zip the skill
        run: cd plugins/pic-to-blender/skills && zip -r "$GITHUB_WORKSPACE/pic-to-blender.zip" pic-to-blender -x '*/__pycache__/*' '*.DS_Store'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pic-to-blender.zip --title "pic-to-blender $GITHUB_REF_NAME" --generate-notes --verify-tag
